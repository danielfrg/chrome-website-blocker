<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SiteBlocker</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="ui.js"></script>
  </head>
  <body class="popup">
    <main>
      <header class="brand">
        <img src="icons/icon32.png" alt="" width="28" height="28" />
        <h1>SiteBlocker</h1>
      </header>
      <p id="status" class="sr-only" aria-live="polite">Loading sites…</p>
      <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <button id="retry" class="secondary" hidden>Retry</button
      ><button id="reload-extension" class="secondary" hidden>Reload extension</button>
      <fieldset class="current-site" data-controls disabled>
        <legend id="current-note">Current site</legend>
        <label for="current-mode" class="sr-only">Blocking for current site</label
        ><select id="current-mode" hidden>
          <option value="block">Block</option>
          <option value="schedule">Schedule</option>
          <option value="unblocked">Unblocked</option></select
        ><button id="add-current" class="primary full" disabled>Block current site</button>
      </fieldset>
      <button id="open-settings" class="secondary full">Manage sites &amp; schedule</button>
    </main>
  </body>
</html>
