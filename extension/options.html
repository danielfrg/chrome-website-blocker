<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings · SiteBlocker</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="ui.js"></script>
  </head>
  <body class="options">
    <main>
      <header class="page-header">
        <div class="brand">
          <img src="icons/icon32.png" alt="" width="32" height="32" />
          <h1>SiteBlocker</h1>
          <span
            id="header-feedback"
            class="feedback"
            role="status"
            aria-live="polite"
            hidden
          ></span>
        </div>
        <p id="status" class="sr-only" aria-live="polite">Loading sites…</p>
      </header>
      <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <button id="retry" class="secondary" hidden>Retry</button
      ><button id="reload-extension" class="secondary" hidden>Reload extension</button>
      <fieldset data-controls disabled>
        <legend class="sr-only">Sites and blocking options</legend>
        <form id="domain-form">
          <table class="site-table">
            <caption class="sr-only">
              Site blocking settings
            </caption>
            <thead>
              <tr>
                <th scope="col">Site</th>
                <th scope="col">Blocking</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="sites"></tbody>
            <tfoot>
              <tr>
                <td>
                  <label for="domain" class="sr-only">Domain or website URL</label
                  ><input
                    id="domain"
                    name="domain"
                    placeholder="Add a site…"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                  />
                </td>
                <td>
                  <label for="new-mode" class="sr-only">Blocking for new site</label
                  ><select id="new-mode">
                    <option value="block">Block</option>
                    <option value="schedule">Schedule</option>
                    <option value="unblocked">Unblocked</option>
                  </select>
                </td>
                <td><button class="primary" type="submit">Add</button></td>
              </tr>
            </tfoot>
          </table>
        </form>
      </fieldset>
      <section id="schedule-settings" class="shared-schedule" aria-labelledby="schedule-heading">
        <div class="schedule-heading">
          <h2 id="schedule-heading">Schedule</h2>
          <span
            id="schedule-feedback"
            class="feedback"
            role="status"
            aria-live="polite"
            hidden
          ></span>
        </div>
        <fieldset data-controls disabled>
          <legend class="sr-only">Shared weekly schedule</legend>
          <form id="schedule-form">
            <fieldset class="days-field">
              <legend>Start days</legend>
              <div id="days" class="days"></div>
            </fieldset>
            <div class="time-fields">
              <label for="start"
                >Start time<input id="start" type="time" value="09:00" required /></label
              ><label for="end"
                >End time<input id="end" type="time" value="17:00" required
              /></label>
            </div>
            <div class="actions">
              <button type="submit" class="primary">Save schedule</button
              ><button type="button" id="reload-schedule" class="secondary">Reload schedule</button
              ><button type="button" id="clear-schedule" class="text-button danger">Clear</button>
            </div>
          </form>
        </fieldset>
      </section>
      <footer>
        <details>
          <summary>Advanced</summary>
          <button id="reset" class="danger secondary">Reset all settings</button>
        </details>
      </footer>
    </main>
  </body>
</html>
